<style>
/* Layout: fixed left module rail + sticky top bar + scrolling work area; detail drawer slides in from the right. */
:root {
  --bg: #eef2f1; --surface: #ffffff; --surface-2: #f6f8f7; --ink: #14201d; --muted: #586864; --faint: #5d6c67; --field: #84928e;
  --line: #d9e1df; --line-2: #e8eeec;
  --accent: #0d6857; --accent-ink: #ffffff; --accent-soft: #dcefe9; --accent-text: #0a5a4b;
  --rail: #10302a; --rail-ink: #c9dfd9; --rail-muted: #7fa39a; --rail-hi: #1b463d;
  --good: #1d7a3e; --good-soft: #e1f3e6; --warn: #9a5b00; --warn-soft: #fbefd9; --bad: #b3261e; --bad-soft: #fbe5e3; --info: #2a5fa8; --info-soft: #e2ebf8;
  --series-1: #2a78d6; --series-2: #eb6834;
  --shadow: 0 1px 2px rgba(16, 40, 35, .06), 0 8px 24px rgba(16, 40, 35, .08);
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1312; --surface: #141c1a; --surface-2: #19221f; --ink: #e2ebe8; --muted: #9aaba6; --faint: #8c9c97; --field: #5f706b;
  --line: #26322f; --line-2: #1e2826;
  --accent: #46b89f; --accent-ink: #04201a; --accent-soft: #163631; --accent-text: #6fd0b9;
  --rail: #0a0f0e; --rail-ink: #c3d6d1; --rail-muted: #6c8780; --rail-hi: #16302a;
  --good: #5cc77a; --good-soft: #15301f; --warn: #e3a646; --warn-soft: #33270f; --bad: #f07a70; --bad-soft: #3a1a17; --info: #7aa9ec; --info-soft: #172840;
  --series-1: #3987e5; --series-2: #d95926;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1312; --surface: #141c1a; --surface-2: #19221f; --ink: #e2ebe8; --muted: #9aaba6; --faint: #8c9c97; --field: #5f706b;
  --line: #26322f; --line-2: #1e2826;
  --accent: #46b89f; --accent-ink: #04201a; --accent-soft: #163631; --accent-text: #6fd0b9;
  --rail: #0a0f0e; --rail-ink: #c3d6d1; --rail-muted: #6c8780; --rail-hi: #16302a;
  --good: #5cc77a; --good-soft: #15301f; --warn: #e3a646; --warn-soft: #33270f; --bad: #f07a70; --bad-soft: #3a1a17; --info: #7aa9ec; --info-soft: #172840;
  --series-1: #3987e5; --series-2: #d95926;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35); color-scheme: dark; }

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.5 var(--font); }
* { box-sizing: border-box; }
a { color: var(--accent-text); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; font-size: 13px; }
.mono { font-family: var(--mono); font-size: 13px; }
.muted { color: var(--muted); } .small { font-size: 12.5px; }

.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--rail); color: var(--rail-ink); position: sticky; top: 0; height: 100vh; overflow-y: auto; padding: 14px 10px 24px max(10px, env(safe-area-inset-left, 0px)); }
.brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 16px; }
.brand-mark { width: 30px; height: 30px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; }
.brand-mark svg { display: block; }
.brand b { display: block; font-size: 15px; letter-spacing: .01em; color: #fff; }
.brand span { font-size: 11.5px; color: var(--rail-muted); }
.nav-group { margin-top: 12px; }
.nav-group h4 { margin: 0 0 4px; padding: 0 10px; font-size: 10.5px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--rail-muted); }
.nav a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; border-radius: 6px; color: var(--rail-ink); text-decoration: none; font-size: 13.5px; }
.nav a:hover { background: var(--rail-hi); }
.nav a.on { background: var(--rail-hi); color: #fff; box-shadow: inset 3px 0 0 var(--accent); }
.nav .count { font-family: var(--mono); font-size: 11px; background: var(--accent); color: var(--accent-ink); border-radius: 9px; padding: 0 6px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 10px max(20px, env(safe-area-inset-right, 0px)) 10px 20px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.btn.menu-btn { display: none; }
.search { position: relative; flex: 1; max-width: 460px; }
.search input { width: 100%; padding: 7px 10px 7px 32px; border: 1px solid var(--field); border-radius: 7px; background: var(--surface-2); }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--faint); }
.search-results { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); max-height: 60vh; overflow-y: auto; z-index: 40; }
.search-results button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--line-2); }
.search-results button:hover, .search-results button:focus { background: var(--accent-soft); }
.search-results small { display: block; color: var(--muted); }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.top-right label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }

.content { padding: 22px max(20px, env(safe-area-inset-right, 0px)) 60px max(20px, env(safe-area-inset-left, 0px)); min-width: 0; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
.page-head h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.01em; text-wrap: balance; }
.page-head p { margin: 2px 0 0; color: var(--muted); max-width: 70ch; }
.crumb { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); font-weight: 600; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 500; font-size: 13px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 3px 9px; font-size: 12.5px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.link { border: 0; background: none; padding: 0; color: var(--accent-text); text-decoration: underline; text-underline-offset: 2px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.card > h3, .card-h { margin: 0; padding: 12px 16px; font-size: 14px; font-weight: 600; border-bottom: 1px solid var(--line-2); display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card .pad { padding: 14px 16px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-main { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.stack { display: flex; flex-direction: column; gap: 16px; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.kpi .l { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.kpi .v { font-family: var(--mono); font-size: 21px; font-weight: 500; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi .s { font-size: 12px; color: var(--muted); }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 14px; overflow-x: auto; }
.tabs button { border: 0; background: none; padding: 8px 14px; cursor: pointer; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }

.tbl-wrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.t th { text-align: left; font-size: 11.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.t th.num { text-align: right; }
.t td { padding: 8px 12px; border-bottom: 1px solid var(--line-2); vertical-align: top; }
.t tr:hover td { background: var(--surface-2); }
.t tfoot td { font-weight: 600; border-top: 2px solid var(--line); background: var(--surface-2); }
.t .sub td { color: var(--muted); }
.t .indent { padding-left: 28px; }
.t .grp td { font-weight: 600; background: var(--surface-2); }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.th-sort { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
.th-sort:hover { color: var(--ink); }
.th-sort:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
.t th.num .th-sort { justify-content: flex-end; width: 100%; }
.sort-ind { font-size: 11px; min-width: 8px; }
.tbl-more { display: flex; gap: 8px; align-items: center; justify-content: center; padding: 10px; flex-wrap: wrap; }
.nav-toggle { all: unset; box-sizing: border-box; cursor: pointer; display: flex; width: 100%; align-items: center; gap: 8px; justify-content: space-between; padding: 2px 0; }
.nav-toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.nav-toggle .chev { margin-left: auto; font-size: 13px; }
.nav-group h4 .count { font-size: 10px; }
.empty { padding: 28px 16px; text-align: center; color: var(--muted); }

.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill.info { background: var(--info-soft); color: var(--info); border-color: transparent; }
.pill.accent { background: var(--accent-soft); color: var(--accent-text); border-color: transparent; }

.form { display: grid; gap: 12px; }
.row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span { font-size: 12px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea, .cell-in { padding: 7px 9px; border: 1px solid var(--field); border-radius: 6px; background: var(--surface); width: 100%; min-width: 0; }
.cell-in { padding: 5px 7px; }
.field input:focus, .field select:focus, .cell-in:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.hint { font-size: 12px; color: var(--muted); }
.callout { padding: 10px 12px; border-radius: 8px; background: var(--info-soft); color: var(--ink); font-size: 13px; border: 1px solid transparent; }
.callout.warn { background: var(--warn-soft); } .callout.bad { background: var(--bad-soft); } .callout.good { background: var(--good-soft); }
.lines-tbl td { padding: 4px 6px; } .lines-tbl th { padding: 6px; }

.scrim { position: fixed; inset: 0; background: rgba(8, 20, 17, .38); z-index: 50; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(720px, 100vw); background: var(--surface); z-index: 60; display: flex; flex-direction: column; box-shadow: var(--shadow); border-left: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.drawer header { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px max(18px, env(safe-area-inset-right, 0px)) 14px 18px; border-bottom: 1px solid var(--line); }
.drawer header h2 { margin: 0; font-size: 17px; font-weight: 600; }
.drawer .body { padding: 16px max(18px, env(safe-area-inset-right, 0px)) 16px 18px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 16px; }
.drawer footer { padding: 12px max(18px, env(safe-area-inset-right, 0px)) 12px 18px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.drawer .err { color: var(--bad); font-size: 13px; margin-right: auto; align-self: center; }
.dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px 16px; }
.dl div > span:first-child { display: block; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }

.toasts { position: fixed; bottom: max(16px, env(safe-area-inset-bottom, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 80; max-width: min(440px, calc(100vw - 32px)); }
.toast { background: var(--ink); color: var(--bg); padding: 10px 14px; border-radius: 8px; box-shadow: var(--shadow); font-size: 13.5px; }
.toast.bad { background: var(--bad); color: #fff; }

.flow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12.5px; }
.flow .step { padding: 3px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface-2); }
.flow .step.done { background: var(--good-soft); border-color: transparent; color: var(--good); }
.flow .step.cur { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); }
.flow .arrow { color: var(--faint); }
.tree { list-style: none; margin: 0; padding-left: 18px; border-left: 1px dashed var(--line); }
.tree.root { padding-left: 0; border-left: 0; }
.tree li { margin: 6px 0; }
.node { display: inline-flex; flex-direction: column; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.node small { color: var(--muted); }
.legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.chart-tip { position: absolute; pointer-events: none; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 6px; padding: 6px 9px; font-size: 12px; white-space: nowrap; z-index: 5; }

@media (max-width: 960px) { .g2, .g3, .g-main { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; left: 0; top: 0; bottom: 0; width: 260px; z-index: 70; transform: translateX(-100%); transition: transform .2s; padding-top: max(14px, env(safe-area-inset-top, 0px)); }
  .rail.open { transform: none; box-shadow: var(--shadow); }
  .btn.menu-btn { display: inline-flex; }
  .top { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); flex-wrap: wrap; }
  .search { order: 3; flex-basis: 100%; max-width: none; }
  .content { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .top-right .chip.hide-sm { display: none; }
}
@media (prefers-reduced-motion: reduce) { .rail { transition: none; } }
</style>

<div class="app">
  <nav class="rail" id="rail" aria-label="Modules"></nav>
  <div class="main">
    <header class="top">
      <button class="btn sm menu-btn" id="menuBtn" aria-label="Open menu">Menu</button>
      <div class="search">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="globalSearch" type="search" placeholder="Search pages, people, suppliers, invoices, journals (Ctrl+K)" autocomplete="off" aria-label="Global search">
        <div class="search-results" id="searchResults" hidden></div>
      </div>
      <div class="top-right">
        <span class="chip hide-sm" id="todayChip"></span>
        <label for="roleSel">Role <select id="roleSel" class="cell-in" style="width:auto"></select></label>
        <button class="btn sm" id="resetBtn" title="Restore the demo data">Reset demo</button>
      </div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>
